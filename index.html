    <!-- Load Supabase BEFORE using it -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script>
        document.getElementById("year").textContent =
            new Date().getFullYear();

        // Replace these two placeholders with your real values.
        const SUPABASE_URL = "https://hkhwzpewnkxjaojmuyet.supabase.com";
        const SUPABASE_PUBLISHABLE_KEY = "b_publishable_4zo6UL8_xWvHZw1Em4Mqnw_bM_3924T";

        const db = window.supabase.createClient(
            SUPABASE_URL,
            SUPABASE_PUBLISHABLE_KEY
        );

        // BOOKING FORM
        document.getElementById("bookingForm").addEventListener(
            "submit",
            async function (event) {
                event.preventDefault();

                const form = this;
                const message =
                    document.getElementById("bookingMessage");

                const booking = {
                    customer_name:
                        document.getElementById("bookName").value.trim(),
                    customer_email:
                        document.getElementById("bookEmail").value.trim(),
                    service:
                        document.getElementById("bookService").value,
                    booking_date:
                        document.getElementById("bookDate").value,
                    booking_time:
                        document.getElementById("bookTime").value

                    // The database sets status to "pending" automatically.
                };

                message.style.display = "block";
                message.classList.remove("error");
                message.textContent = "Submitting your booking...";

                try {
                    const { error } = await db
                        .from("bookings")
                        .insert(booking);

                    if (error) {
                        console.error("Booking error:", error);
                        message.classList.add("error");
                        message.textContent =
                            "Booking failed. Please try again.";
                        return;
                    }

                    message.classList.remove("error");
                    message.textContent =
                        "Booking request submitted successfully! " +
                        "Your appointment is pending confirmation.";

                    form.reset();

                } catch (error) {
                    console.error("Connection error:", error);
                    message.classList.add("error");
                    message.textContent =
                        "Connection error. Please try again later.";
                }
            }
        );
    </script>

</body>
