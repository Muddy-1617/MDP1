    <!-- Load Supabase BEFORE using it -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

   
<script>
    document.getElementById("year").textContent =
        new Date().getFullYear();

    const SUPABASE_URL =
        "PASTE_YOUR_EXACT_PROJECT_URL_HERE";

    const SUPABASE_PUBLISHABLE_KEY =
        "PASTE_YOUR_EXACT_PUBLISHABLE_KEY_HERE";

    const db = window.supabase.createClient(
        SUPABASE_URL,
        SUPABASE_PUBLISHABLE_KEY
    );

    // BOOKING FORM
    document.getElementById("bookingForm").addEventListener(
        "submit",
        async function (event) {
            event.preventDefault();

            const form = this;
            const message =
                document.getElementById("bookingMessage");

            const booking = {
                customer_name:
                    document.getElementById("bookName").value.trim(),

                customer_email:
                    document.getElementById("bookEmail").value.trim(),

                service:
                    document.getElementById("bookService").value,

                booking_date:
                    document.getElementById("bookDate").value,

                booking_time:
                    document.getElementById("bookTime").value || null
            };

            message.style.display = "block";
            message.classList.remove("error");
            message.textContent = "Submitting your booking...";

            try {
                const { error } = await db
                    .from("bookings")
                    .insert(booking);

                if (error) {
                    console.error("Booking error:", error);
                    message.classList.add("error");
                    message.textContent =
                        "Booking failed: " + error.message;
                    return;
                }

                message.textContent =
                    "Booking request submitted successfully! " +
                    "Your appointment is pending confirmation.";

                form.reset();

            } catch (error) {
                console.error("Connection error:", error);
                message.classList.add("error");
                message.textContent =
                    "Connection error. Please try again later.";
            }
        }
    );
</script>
